# Free web service; the separately provisioned free database uses environment variables.
services:
  - type: web
    name: atmos-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ATMOS_PRODUCTION
        value: "true"
      - key: ATMOS_PUBLISH_DURABLE
        value: "false"
