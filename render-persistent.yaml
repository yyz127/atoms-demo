# Optional future configuration only. User selected the free render.yaml plan.
# Creates paid compute + a 1 GB persistent artifact disk; requires separate authorization.
services:
  - type: web
    name: atmos-demo
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: published-html
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ATMOS_PRODUCTION
        value: "true"
      - key: ATMOS_PUBLISH_DIR
        value: /var/data/published
      - key: ATMOS_PUBLISH_DURABLE
        value: "true"
